<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Flight Reports</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/cockpit.css') }}"
    />
  </head>
  <body class="reports-page">
    <header id="top-bar">
      <span class="title">ROCKET FLIGHT REPORTS</span>
      <div class="page-nav">
        <a href="/" class="ctrl-btn nav-link">LIVE DASHBOARD</a>
      </div>
    </header>

    <main id="report-layout">
      <aside class="instrument-panel report-sidebar">
        <div class="report-sidebar-header">
          <h2>RECORDED FLIGHTS</h2>
          <button id="btn-refresh-reports" class="ctrl-btn">REFRESH</button>
        </div>
        <div id="report-flight-list" class="report-flight-list"></div>
      </aside>

      <section class="instrument-panel report-viewer">
        <div class="report-viewer-header">
          <div>
            <h2>FLIGHT REPORT</h2>
            <div id="report-selected-title" class="report-selected-title">
              Loading recorded flights...
            </div>
          </div>
          <span id="report-status" class="value status-inactive">WAITING</span>
        </div>

        <div class="report-section-heading">
          <h3>RAW TELEMETRY</h3>
          <div class="report-section-note">
            Original values recorded during the flight
          </div>
        </div>
        <div id="report-summary" class="report-summary"></div>

        <div class="report-card">
          <h3>FLIGHT VIDEO</h3>
          <div id="report-video-slot" class="report-video-slot"></div>
        </div>

        <div id="report-grid" class="report-grid"></div>

        <div class="report-section-heading report-section-separated">
          <h3>SMOOTHED TELEMETRY</h3>
          <div id="report-smoothing-note" class="report-section-note">
            Sliding median filter
          </div>
        </div>
        <div id="report-smoothed-summary" class="report-summary"></div>
        <div id="report-smoothed-grid" class="report-grid"></div>
      </section>
    </main>

    <div id="report-lightbox" class="report-lightbox hidden" aria-hidden="true">
      <button
        id="report-lightbox-close"
        type="button"
        class="report-lightbox-close"
        aria-label="Close full screen graph"
      >
        CLOSE
      </button>
      <div class="report-lightbox-content">
        <div id="report-lightbox-title" class="report-lightbox-title"></div>
        <img id="report-lightbox-image" alt="" class="report-lightbox-image" />
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/report.js') }}"></script>
  </body>
</html>
